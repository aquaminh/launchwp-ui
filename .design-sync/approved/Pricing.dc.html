<!-- Approved design: Pricing (fetched from design project e77fde1e-6be7-44cf-970a-d0786ab9a302). Layout truth = <x-dc> markup; renderVals() = data shape; mockup TEXT is never a copy source. KNOWN HONESTY BUGS TO CORRECT AT PORT: (1) comparison "AI & automation" rows mark approval queue + MCP Adapter false on Starter/Growth - WRONG, both are on EVERY plan; (2) subhead "The approval queue and MCP Adapter begin where sites move to a dedicated droplet" - WRONG, same reason; (3) FAQ "What changes between shared pool and dedicated droplet?" answer repeats the same false claim - the real differentiator is the dedicated droplet + priority support (Agency). Nav links Regions/Docs are invented - use real nav. -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    .lwp-plan-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; align-items: stretch; }
    @media (max-width: 1000px) { .lwp-plan-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .lwp-plan-grid { grid-template-columns: 1fr; } }
    .lwp-svc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    @media (max-width: 820px) { .lwp-svc-grid { grid-template-columns: 1fr; } }
    .lwp-cmp-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid hsl(var(--launchwp-border)); border-radius: var(--launchwp-radius-lg); background: hsl(var(--launchwp-card)); }
    .lwp-cmp { min-width: 780px; width: 100%; border-collapse: collapse; font-size: 14px; }
    .lwp-cmp th, .lwp-cmp td { text-align: left; padding: 13px 18px; vertical-align: middle; }
    .lwp-cmp .lwp-vcol { text-align: center; width: 15%; }
    .lwp-cmp .lwp-fcol { position: sticky; left: 0; background: hsl(var(--launchwp-card)); z-index: 2; min-width: 220px; }
    .lwp-cmp tbody tr { border-top: 1px solid hsl(var(--launchwp-border)); }
    .lwp-cmp .lwp-dedic { border-left: 2px solid hsl(var(--launchwp-primary) / 0.5); }
    .lwp-cmp-secrow td { background: hsl(var(--launchwp-muted)); font-family: var(--launchwp-font-mono); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: hsl(var(--launchwp-muted-foreground)); padding-top: 10px; padding-bottom: 10px; }
    .lwp-cmp-secrow .lwp-fcol { background: hsl(var(--launchwp-muted)); }
  </style>
</helmet>
